name: check-refs

on:
  pull_request:
    paths:
      - "references.md"
      - "scripts/check_refs.py"
      - ".github/workflows/check-refs.yml"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  check-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve every reference ID
        run: python3 scripts/check_refs.py
